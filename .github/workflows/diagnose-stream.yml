name: Diagnose streaming endpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-stream.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test endpoints
        shell: bash
        run: |
          set +e
          for url in             "https://br.cdn.dos.zone/vcsky/vc-sky-en-v6.data"             "https://br.cdn.dos.zone/vcsky/vc-sky-en-v6.wasm"             "https://cdn.dos.zone/vcsky/sha256sums.txt"             "https://gta-proxy.editingking-2977.workers.dev/"
          do
            echo "===== $url ====="
            curl -L -sS --max-time 25 -r 0-1023 -D - -o /tmp/body "$url"
            echo "curl_exit=$?"
            wc -c /tmp/body 2>/dev/null || true
            echo
          done
