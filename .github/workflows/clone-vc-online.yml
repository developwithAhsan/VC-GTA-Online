name: Clone vc-online into VC-GTA-Online

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/developwithAhsan/vc-online.git /tmp/vc-online-source

      - name: Copy exact source snapshot except workflow files
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/vc-online-source/ ./

      - name: Commit cloned snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Target already matches source outside workflow files."
            exit 0
          fi
          git commit -m "Clone vc-online files into VC-GTA-Online"
          git push origin HEAD:main
